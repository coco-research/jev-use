name: ci

# Every PR must be provably green before merge. This is the "testable PR" contract:
# a PR without a passing run is not reviewable.
#
# WHY ubuntu, NOT macos:
#   1. GitHub-hosted macOS runners CANNOT test the accessibility code anyway. They have
#      no logged-in GUI session and no Accessibility permission, so AXUIElement calls
#      fail there regardless of runner. AX behaviour is verified LOCALLY, by the
#      pre-push hook and the parity harness.
#   2. ubuntu is faster and simpler. The cost argument no longer applies now the repo is
#      public - Actions is free and unlimited for public repositories - but the
#      capability argument does, and it is the one that matters.
#
# So this workflow tests what IS testable in CI: pure logic, types, formatting, lints,
# docs. The crate is deliberately kept free of macOS-only dependencies so this stays
# true; macOS-only code goes in a cfg(target_os = "macos") module and is covered locally.
# See docs/rules.md R8 and docs/memory.md D7.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A new push to the same branch cancels the previous run: saves budget, and avoids
  # reviewing a result that no longer matches the code.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Fast gate. Separate job so formatting feedback lands in about a minute rather than
  # after a full build. Cheapest job, so it runs first.
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # The real gate for logic: types, predicates, the fingerprint, the caps.
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  # Docs must build: the crate is where the design lives, and a doc comment that does
  # not compile is a broken contract.
  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
