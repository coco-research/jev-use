name: ci

# Every PR must be provably green before merge. This is the "testable PR" contract:
# a PR without a passing run is not reviewable.
#
# WHY ubuntu, NOT macos:
#   1. macOS runners bill at 10x. On a private repo sharing an account budget, this
#      is the difference between CI running and CI being refused outright.
#   2. GitHub-hosted macOS runners CANNOT test the accessibility code anyway. They
#      have no logged-in GUI session and no Accessibility permission, so AXUIElement
#      calls would fail there regardless of the runner.
#
# So this workflow tests what is testable in CI: pure logic, types, formatting, lints,
# docs. AX behaviour against real apps is verified LOCALLY by the pre-push hook and by
# the parity harness. That split is deliberate - see docs/rules.md R8 and docs/memory.md.
#
# The crate is kept free of macOS-only dependencies precisely so this stays possible.

# TRIGGERS ARE MANUAL ON PURPOSE.
#
# This account's Actions budget is exhausted, so every push fails with "The job was
# not started because an Actions budget is preventing further use." That is true even
# on ubuntu at 1x, so it is not a macOS-multiplier problem.
#
# A permanently-red CI is worse than no CI: it trains you to ignore the signal, and
# then you miss it when it is real. So the gate lives in .githooks/pre-push - local,
# free, 1.5 s, and able to test accessibility code that no GitHub runner can reach.
#
# TO RE-ENABLE on every push, uncomment these two triggers:
#   push:
#     branches: [main]
#   pull_request:
#     branches: [main]
#
# Three ways to get real CI back, cheapest first:
#   1. Self-hosted runner on this Mac. Free, unlimited, and the only option that can
#      run the accessibility tests, because it has a GUI session and the permission.
#      Best technical answer for this project.
#   2. Make the repo public. Public repos get unlimited Actions minutes.
#   3. Buy minutes, or upgrade the plan. macOS bills at 10x ubuntu.
on:
  workflow_dispatch:

concurrency:
  # A new push to the same branch cancels the previous run: saves budget, and avoids
  # reviewing a result that no longer matches the code.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Fast gate. Separate job so formatting feedback lands in about a minute rather than
  # after a full build. Cheapest job, so it runs first.
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # The real gate for logic: types, predicates, the fingerprint, the caps.
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  # Docs must build: the crate is where the design lives, and a doc comment that does
  # not compile is a broken contract.
  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
