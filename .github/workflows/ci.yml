name: ci

# Every PR must be provably green before merge. This is the "testable PR" contract:
# a PR without a passing run is not reviewable.
#
# WHERE EACH JOB RUNS, AND WHY:
#   ubuntu  - lint, test, docs. Pure logic, types, formatting, the fingerprint, the caps.
#             Fast, free, and the right place for everything that is not macOS.
#   self-hosted macOS - the accessibility path. It is cfg(target_os = "macos"), so no
#             ubuntu runner ever compiles it, and a GITHUB-HOSTED macOS runner cannot test
#             it either: no logged-in GUI session, no accessibility grant. The only place
#             that can run it is a machine with both, which is what `coco-mac-jevu` is.
# See docs/memory.md D16 for the registration and the security guard that keeps fork pull
# requests off that machine.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A new push to the same branch cancels the previous run: saves budget, and avoids
  # reviewing a result that no longer matches the code.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Fast gate. Separate job so formatting feedback lands in about a minute rather than
  # after a full build. Cheapest job, so it runs first.
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # The real gate for logic: types, predicates, the fingerprint, the caps.
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  # Docs must build: the crate is where the design lives, and a doc comment that does
  # not compile is a broken contract.
  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  # The macOS path, on a machine that has one.
  #
  # WHY THIS JOB EXISTS: the accessibility code is cfg(target_os = "macos"), so an ubuntu
  # runner never compiles it - CI could not verify a single line of it, and the local
  # pre-push hook was the only thing that ever ran it. This job runs it in CI, on the
  # self-hosted runner `coco-mac-jevu`, which has a real GUI session.
  #
  # SECURITY, AND WHY THE GUARD IS NOT OPTIONAL: this repository is public, and a
  # self-hosted runner executes whatever a workflow asks it to, on a real machine, with a
  # real logged-in user. A pull request from a fork must never reach it. The `if` below
  # allows branches of THIS repository only. Removing it to "make forks work" would hand
  # anyone who can open a PR a shell on this Mac. See docs/memory.md D16.
  macos:
    name: macOS (self-hosted)
    runs-on: [self-hosted, macOS]
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    # One runner serves this repo. A job that hangs would block every later job, so this is
    # short on purpose; the AX messaging timeout (rule R2) protects the tests themselves.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # No toolchain action on purpose: this runner IS the environment under test - its
      # Xcode, its accessibility grant, its machine. Installing a different toolchain here
      # would be testing a machine nobody uses. Print what it is instead.
      # Two things at once, and both are load-bearing.
      #
      # EVIDENCE: this machine IS the thing under test - its macOS version, its Rust, its
      # accessibility grant - so print them rather than describing them.
      #
      # PATH: a launchd-launched runner does not hand steps the user's PATH, so cargo is
      # installed and still not found. Setting it here is portable (no user's home
      # directory in a public workflow) and explicit about the reason.
      - name: environment
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "host:  $(hostname)"
          echo "macOS: $(sw_vers -productVersion)"
          echo "rust:  $(rustc --version)"
          echo "cargo: $(cargo --version)"

      # Compiling is not the same as being allowed to look: accessibility is granted per
      # process by TCC. If this step fails, the fix is in System Settings, not in the code.
      - name: accessibility permission
        run: cargo run --quiet --example check_access -p jev-ax

      # The real thing: the live AX tests, on real apps, in CI.
      - name: test (macOS path, for real)
        run: cargo test --workspace --all-features
