    <path d="M560 380 C680 280, 920 280, 1040 380"/>
  </g>
  <text x="800" y="250" text-anchor="middle" fill="#f5f5f5" font-family="ui-sans-serif, system-ui, -apple-system, Helvetica, Arial" font-size="64" font-weight="600" letter-spacing="4">jev-use</text>
  <text x="800" y="310" text-anchor="middle" fill="#9aa0a6" font-family="ui-sans-serif, system-ui, -apple-system, Helvetica, Arial" font-size="26" letter-spacing="2">voice → intent → any Mac app</text>
  <text x="800" y="460" text-anchor="middle" fill="#5b6169" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="3">PRE-ALPHA · AX RUST PORT · LOCAL</text>
