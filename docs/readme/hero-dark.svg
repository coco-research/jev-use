<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Coco Research — jev-use repo standard">
  <rect width="1600" height="900" fill="#000000"/>
  <defs>
    <linearGradient id="dirB" gradientUnits="userSpaceOnUse" x1="720" y1="160" x2="900" y2="420">
      <stop offset="0%" stop-color="#C2A8FF"/>
      <stop offset="50%" stop-color="#7FB8FF"/>
      <stop offset="100%" stop-color="#A6F0CD"/>
    </linearGradient>
  </defs>
  <!-- Coco company mark: facing two-C arcs (Direction B) -->
  <g fill="none" stroke-linecap="round" transform="translate(800,300)">
    <!-- Left C: white -->
    <path d="M 24,-100 A 100 100 0 1 0 24,100" stroke="#FFFFFF" stroke-width="22"/>
    <!-- Right C: Direction B gradient -->
    <path d="M -24,-100 A 100 100 0 1 1 -24,100" stroke="url(#dirB)" stroke-width="22"/>
  </g>
</svg>
