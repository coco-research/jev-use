<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-label="jev-use — voice to intent to any Mac app">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="55%" stop-color="#0e0e0f"/>
      <stop offset="100%" stop-color="#121214"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5b6169" stop-opacity="0"/>
      <stop offset="40%" stop-color="#9aa0a6" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#e8eaed" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5b6169" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="640" fill="url(#bg)"/>
  <!-- faint grid -->
  <g stroke="#1c1c1e" stroke-width="1" opacity="0.7">
