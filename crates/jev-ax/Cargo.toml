[package]
name = "jev-ax"
description = "macOS Accessibility observation and execution, shaped for Jev's decision layer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true


# computes `sha256("|".join(f"{kind}:{label}:{value}"))[:16]` and parity (rule R8) compares
# that string across the two implementations.
#
# Deliberately NOT target-gated: it is pure logic, so ubuntu CI tests it. Keeping the hash
# in the default dependency set is the whole reason it can be verified on a runner that has
# no Accessibility grant.
[dependencies]
sha2 = "0.10"
# macOS-only, and target-scoped on purpose. CI runs on ubuntu, where these do not
# exist. Keeping them out of the default dependency set is what lets the pure logic
# (Rect, Element, Limits, fingerprint) stay testable in CI while the platform code is
# gated behind cfg(target_os = "macos") and covered by the local pre-push hook.
#
# The macOS code IS tested — just on the machine, not in CI. See .metagpt/GATE.json
# for the known gap and the self-hosted runner that would close it.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", features = ["CFString", "CFArray", "CFNumber"] }
objc2-application-services = { version = "0.3", features = ["HIServices"] }
# default-features = false, then the minimum needed. Enabling AppKit's defaults pulls
# in every framework binding and costs minutes of compile time for two types.
#
# `libc` is NOT optional: NSRunningApplication::processIdentifier returns libc::pid_t,
# and without the feature those methods do not exist. That failure reads as
# "no method named processIdentifier found", which looks like a wrong type rather than
# a missing feature.
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "libc",
    "bitflags",
    "NSRunningApplication",
    "NSWorkspace",
] }

# NSString is needed for NSRunningApplication::localizedName(), which returns
# Retained<NSString>. NSEnumerator is needed for NSArray iteration: every iteration
# path in objc2-foundation (iter(), into_iter()) is gated behind it.
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSString",
    "NSEnumerator",
] }

# The walk example prints ONE JSON object for `scripts/parity --live`, and a real screen's
# labels contain quotes, backslashes and newlines. Hand-rolled JSON is a bug farm there, and a
# bug in the emitter would be reported as a walk divergence.
#
# A dev-dependency, and macOS-scoped, for two reasons: only the example needs it, and the
# example's macOS half is the only half that renders anything. The ubuntu job still compiles
# the example - and the walk's pure logic - without it.
[target.'cfg(target_os = "macos")'.dev-dependencies]
serde_json = "1"
